
<section class="quiz-setup">
  <header class="header">
    <p class="eyebrow">Mandarin Vocabulary Practice</p>
    <h1>Choose Quiz Type</h1>

    @if (hskLevel() !== null) {
      <p class="level-label">HSK {{ hskLevel() }}</p>
    }

    <p class="intro">
      Choose how you want to practise your Chinese vocabulary.
    </p>
  </header>

  <div class="quiz-grid">
    <button
      type="button"
      class="quiz-card"
      (click)="selectQuizType('hanzi_to_meaning')"
    >
      <span class="quiz-icon" aria-hidden="true">文</span>
      <span class="quiz-title">Hanzi → Meaning</span>
      <span class="quiz-description">
        See the Chinese word and choose its meaning.
      </span>
      <span class="card-action">Start practice →</span>
    </button>

    <button
      type="button"
      class="quiz-card"
      (click)="selectQuizType('meaning_to_hanzi')"
    >
      <span class="quiz-icon" aria-hidden="true">字</span>
      <span class="quiz-title">Meaning → Hanzi</span>
      <span class="quiz-description">
        See the meaning and choose the Chinese word.
      </span>
      <span class="card-action">Start practice →</span>
    </button>

    <button
      type="button"
      class="quiz-card"
      (click)="selectQuizType('hanzi_to_pinyin')"
    >
      <span class="quiz-icon" aria-hidden="true">拼</span>
      <span class="quiz-title">Hanzi → Pinyin</span>
      <span class="quiz-description">
        See the Chinese word and choose its pronunciation.
      </span>
      <span class="card-action">Start practice →</span>
    </button>

    <button
      type="button"
      class="quiz-card"
      (click)="selectQuizType('pinyin_to_hanzi')"
    >
      <span class="quiz-icon" aria-hidden="true">音</span>
      <span class="quiz-title">Pinyin → Hanzi</span>
      <span class="quiz-description">
        See the pronunciation and choose the Chinese word.
      </span>
      <span class="card-action">Start practice →</span>
    </button>
  </div>
</section>
